name = "real-world-harness"
description = "Real-life adjacent benchmark tasks for the Tether harness."
results_dir = "benchmarks"
# 0 runs one full task wave across all configured models at the same time.
max_parallel = 0
judge_parallel = 2
judge_group_size = 5
task_timeout = "5m"

[scoring]
objective_weight = 0.35
subjective_weight = 0.65
completion_weight = 0.25
duration_weight = 0.25
latency_weight = 0.10
token_weight = 0.20
cost_weight = 0.15
efficiency_weight = 0.10
judge_rank_weight = 0.45
judge_rubric_weight = 0.55

[scoring.rubric]
correctness = 0.40
completeness = 0.20
usefulness = 0.25
style = 0.15

